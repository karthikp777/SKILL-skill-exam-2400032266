name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: skill_exam_2400032266
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skill_exam_2400032266"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - micrrservices-network

  wallet-service:
    image: docker-skill-exam-2400032266:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquarium-container
    ports:
      - "8003:8003"
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - micrrservices-network

volumes:
  postgres_data:

networks:
  micrrservices-network:
    driver: bridge